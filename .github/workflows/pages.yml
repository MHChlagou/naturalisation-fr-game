name: Validate and deploy Cap Citoyen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate app structure and question bank
        run: node scripts/validate.mjs

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          SITE_ROOT="${SITE_URL%/}"
          retry_curl() {
            curl --fail --silent --show-error --location \
              --retry 10 --retry-all-errors --retry-delay 3 "$@"
          }

          retry_curl "$SITE_URL" -o /tmp/cap-citoyen-index.html
          grep -q "Cap Citoyen - Apprendre, comprendre, réussir" /tmp/cap-citoyen-index.html
          grep -q 'styles.css' /tmp/cap-citoyen-index.html
          grep -q 'app.js' /tmp/cap-citoyen-index.html
          grep -q 'manifest.webmanifest' /tmp/cap-citoyen-index.html

          for asset in app.js styles.css manifest.webmanifest sw.js questions-bank.js questions-extra.js assets/guide.svg; do
            echo "Checking ${asset}"
            retry_curl "$SITE_ROOT/$asset" -o /dev/null
          done

          retry_curl "$SITE_ROOT/manifest.webmanifest" -o /tmp/cap-citoyen-manifest.json
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('/tmp/cap-citoyen-manifest.json','utf8')); if (!m.name || !m.start_url || !m.scope) process.exit(1); console.log('PWA manifest is valid JSON')"
